name : Zack's Blog
markdown: CommonMark
permalink : /blog/:year/:month/:day/:title
defaults :
  - 
    scope:
      path: "" # all files in project
    values:
      layout: "default"

collections:
  recipes:
    output: true

commonmark:
  options: ["FOOTNOTES"]
  extensions: ["strikethrough", "autolink", "table"]